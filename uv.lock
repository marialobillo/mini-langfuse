version = 1
revision = 3
requires-python = ">=3.12"

[manifest]
members = [
    "mini-langfuse-backend",
    "mini-langfuse-demo",
    "mini-langfuse-sdk",
    "mini-langfuse-workspace",
]

[[package]]
name = "mini-langfuse-backend"
version = "0.1.0"
source = { editable = "packages/backend" }

[[package]]
name = "mini-langfuse-demo"
version = "0.1.0"
source = { editable = "examples/demo" }
dependencies = [
    { name = "mini-langfuse-sdk" },
]

[package.metadata]
requires-dist = [{ name = "mini-langfuse-sdk", editable = "packages/sdk" }]

[[package]]
name = "mini-langfuse-sdk"
version = "0.1.0"
source = { editable = "packages/sdk" }

[[package]]
name = "mini-langfuse-workspace"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "mini-langfuse-backend" },
    { name = "mini-langfuse-demo" },
    { name = "mini-langfuse-sdk" },
]

[package.metadata]
requires-dist = [
    { name = "mini-langfuse-backend", editable = "packages/backend" },
    { name = "mini-langfuse-demo", editable = "examples/demo" },
    { name = "mini-langfuse-sdk", editable = "packages/sdk" },
]
